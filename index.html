<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五十音 Dojo · 日语五十音记忆挑战</title>
<style>
:root{--p:#4f46e5;--p2:#e0e7ff;--bg:#f8fafc;--t:#1e293b;--m:#64748b;--b:#e2e8f0;--ok:#16a34a;--no:#dc2626;--pk:#db2777}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
button:active{transform:scale(.94)}
button:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid var(--b)}
.brand{font-weight:800;font-size:1.25rem}.brand small{font-weight:600;color:var(--m);margin-right:6px;font-size:.85rem}
nav{display:flex;background:#f1f5f9;padding:4px;border-radius:10px}
nav button{padding:7px 16px;border-radius:8px;color:var(--m);font-size:.9rem}
nav button.on{background:#fff;color:var(--p);box-shadow:0 1px 3px #0001}
main{max-width:780px;margin:28px auto;padding:0 14px 40px}
.card{background:#fff;border-radius:22px;padding:32px 24px;box-shadow:0 10px 30px #0f172a10}
.hero{text-align:center;margin-bottom:22px;font-size:2.6rem}.hero h1{font-size:1.5rem;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
h3{font-size:.85rem;margin-bottom:8px;color:#334155}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border:1px solid var(--b);border-radius:10px;font-weight:600;color:#475569;background:#fff}
.opt.on{background:var(--p);border-color:var(--p);color:#fff}
.voice{display:flex;gap:8px;align-items:center;margin:6px 0 14px;font-size:.9rem;color:#334155;cursor:pointer}
.voice input{width:18px;height:18px;accent-color:var(--p)}
select{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--b);border-radius:8px;font:inherit;font-size:.85rem;background:#fff;color:var(--t)}
.vrow{display:flex;gap:8px;margin:0 0 14px}
hr{border:0;border-top:1px solid var(--b);margin:14px 0 18px}
h4{font-size:.78rem;color:#475569;margin:14px 0 8px;display:flex;gap:8px;align-items:center}
.all{font-size:.68rem;background:#eef2f7;padding:2px 8px;border-radius:6px;color:var(--m)}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.chip{padding:10px 0;border:1px solid var(--b);border-radius:8px;color:#94a3b8;background:#fff;font-size:.9rem}
.chip.on{background:var(--p2);border-color:#a5b4fc;color:var(--p);font-weight:700}
.go{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.big{padding:28px 10px;border-radius:16px;color:#fff;font-weight:800;font-size:1.1rem;background:var(--p);box-shadow:0 8px 18px #4f46e540;display:flex;flex-direction:column;align-items:center;gap:6px}
.big.mix{background:linear-gradient(135deg,#8b5cf6,#d946ef)}
.big small{font-size:.65rem;opacity:.85;font-weight:600}
.heart{display:block;width:100%;margin-top:16px;padding:22px 10px;border-radius:16px;border:2px solid #f472b6;background:#fdf2f8;color:var(--pk);font-weight:800;font-size:1.05rem}
.heart small{display:block;font-size:.65rem;margin-top:6px;opacity:.9}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px;font-weight:700;font-size:.95rem}
.ic{width:36px;height:36px;border-radius:10px;background:#f1f5f9;margin-left:6px}
.q{font-size:6rem;font-weight:800;text-align:center;line-height:1.2;padding:12px 0;cursor:pointer;user-select:none}
.q.r{font-size:4.6rem;font-family:ui-rounded,"Segoe UI",sans-serif}
.hint{text-align:center;color:var(--m);font-size:.85rem;margin-bottom:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{position:relative;padding:22px 8px;border:2px solid var(--b);border-radius:14px;font-size:2rem;font-weight:700;background:#fff;transition:transform .1s}
.ans{animation:ain .28s both}.ans:hover{border-color:#a5b4fc}
.ans i{position:absolute;left:10px;top:6px;font-size:.7rem;font-style:normal;color:#94a3b8;font-weight:600}
.ans.ok{background:#dcfce7;border-color:var(--ok);animation:pop .5s;box-shadow:0 0 0 5px #16a34a30}.ans.no{background:#fee2e2;border-color:var(--no);animation:sk .4s;box-shadow:0 0 0 5px #dc262625}
.fb{min-height:26px;text-align:center;margin-top:16px;font-weight:700}
.stage{display:flex;align-items:center;gap:16px;background:#fdf2f8;border-radius:16px;padding:12px 16px;margin-bottom:14px}
#girl{width:84px;height:116px;flex:none;shape-rendering:crispEdges}
.side{flex:1}.lay{font-size:.85rem;color:var(--pk);font-weight:700;margin-bottom:8px}
.tb{height:12px;background:#fbcfe8;border-radius:8px;overflow:hidden}.tb i{display:block;height:100%;width:100%;background:var(--pk)}
.shake{animation:sk .35s}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.res{text-align:center}.res .e{font-size:3.4rem}.res h2{margin:6px 0}.res .n{font-size:2.6rem;font-weight:800;color:var(--p)}
.wl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.wl span{background:#fee2e2;border-radius:10px;padding:6px 12px;font-weight:700}
.rb{display:flex;gap:12px;justify-content:center;margin-top:18px}
.rb button{padding:12px 22px;border-radius:12px;font-weight:700;border:1px solid var(--b)}
.rb .pri{background:var(--p);color:#fff;border-color:var(--p)}
.sc{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.kc{display:flex;flex-direction:column;align-items:center;padding:12px 2px;background:#fff;border:1px solid var(--b);border-radius:12px}
.kc:hover{border-color:#a5b4fc;background:#f5f7ff}
.kc b{font-size:1.8rem}.kc span{font-size:.75rem;color:var(--m)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rp .55s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes ain{from{opacity:0;transform:translateY(8px) scale(.96)}}
@keyframes qin{from{opacity:0;transform:scale(.7)}60%{transform:scale(1.06)}}
.pop{animation:pop .32s}
.q.in{animation:qin .38s}
.q.shake{animation:sk .35s}
.kc.hit{animation:pop .4s;background:#e0e7ff;border-color:#818cf8;box-shadow:0 0 0 4px #818cf833}
.sp{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:20;animation:spk .65s ease-out forwards}
@keyframes spk{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 18px;border-radius:10px;font-size:.9rem;z-index:9}
@media(max-width:560px){.card{padding:22px 14px}.two{gap:12px}.chips{grid-template-columns:repeat(4,1fr)}.q{font-size:4.6rem}.ans{font-size:1.6rem;padding:18px 6px}.go{gap:10px}}
@media(prefers-reduced-motion:reduce){.shake,.q.shake,.pop,.q.in,.ans,.kc.hit,.rip{animation:none!important}button{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><small>JP</small>五十音 Dojo</div>
  <nav><button data-v="study">学习图表</button><button data-v="quiz" class="on">记忆挑战</button></nav>
</header>

<main id="study" hidden></main>
<main id="quiz">
  <section class="card" id="cfg"></section>
  <section class="card" id="play" hidden></section>
  <section class="card res" id="res" hidden></section>
</main>
<div id="toast" hidden></div>

<script>
/* ---------- 数据 ---------- */
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// 每个假名: 平假名 + 片假名 + 罗马音;"-" 表示空位(仅用于对齐图表)
const DATA=[
['s','清音 (基础)',[['あ行','あアa いイi うウu えエe おオo'],['か行','かカka きキki くクku けケke こコko'],['さ行','さサsa しシshi すスsu せセse そソso'],['た行','たタta ちチchi つツtsu てテte とトto'],['な行','なナna にニni ぬヌnu ねネne のノno'],['は行','はハha ひヒhi ふフfu へヘhe ほホho'],['ま行','まマma みミmi むムmu めメme もモmo'],['や行','やヤya - ゆユyu - よヨyo'],['ら行','らラra りリri るルru れレre ろロro'],['わ行','わワwa - - - をヲwo'],['ん','んンn']]],
['d','浊音 (VOICED)',[['が行','がガga ぎギgi ぐグgu げゲge ごゴgo'],['ざ行','ざザza じジji ずズzu ぜゼze ぞゾzo'],['だ行','だダda ぢヂdji づヅdzu でデde どドdo'],['ば行','ばバba びビbi ぶブbu べベbe ぼボbo']]],
['p','半浊音',[['ぱ行','ぱパpa ぴピpi ぷプpu ぺペpe ぽポpo']]]
];
const ALL=[],SEC=[];let g=0;
DATA.forEach(([sid,name,rows])=>{
  const s={id:sid,name,rows:[]};
  rows.forEach(([rn,str],ri)=>{
    const rid=sid+ri;
    const cells=str.split(' ').map(x=>x==='-'?null:{h:x[0],k:x[1],r:x.slice(2),rid,g:0});
    cells.forEach(c=>{if(c){c.g=g++;ALL.push(c)}});
    s.rows.push({id:rid,name:rn,cells});
  });
  SEC.push(s);
});
const MODES=[['h','平假名 (あ)'],['k','片假名 (ア)'],['r','罗马音 (a)'],['x','🎲 随机 (Random)']];
const MN={h:'平假名',k:'片假名',r:'罗马音'};

/* ---------- 设置 ---------- */
let cfg={q:'h',o:'k',rows:['s0','s1'],voice:true,vname:''};
try{const s=JSON.parse(localStorage.getItem('gojuon-cfg'));if(s&&s.rows)cfg=Object.assign(cfg,s)}catch(e){}
const save=()=>{try{localStorage.setItem('gojuon-cfg',JSON.stringify(cfg))}catch(e){}};
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,1800)}

/* ---------- 语音(女声优先) ---------- */
const FEMALE=/nanami|kyoko|haruka|ayumi|mizuki|sayaka|ayana|shiori|aoi|o-ren|hina|mayu|google|female|女/i;
const MALE=/ichiro|ichirou|keita|otoya|hattori|takumi|naoki|daichi|kenji|\bmale\b|男/i;
let jv=[],au=null;
function loadVoices(){
  if(!('speechSynthesis' in window))return;
  jv=speechSynthesis.getVoices().filter(v=>/^ja/i.test((v.lang||'').replace('_','-')));
}
function bestVoice(){
  if(cfg.vname){const v=jv.find(v=>v.name===cfg.vname);if(v)return v}
  const ok=jv.filter(v=>!MALE.test(v.name));
  return ok.find(v=>/nanami|natural/i.test(v.name))||ok.find(v=>/google/i.test(v.name))||ok.find(v=>FEMALE.test(v.name))||ok[0]||jv[0]||null;
}
function stopSay(){try{'speechSynthesis' in window&&speechSynthesis.cancel();au&&au.pause()}catch(e){}}
function sayOnline(t){  // 在线女声(非官方接口,需联网;失败则静默)
  try{au=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ja&q='+encodeURIComponent(t));au.play().catch(()=>{})}catch(e){}
}
function say(text,force){
  if(!cfg.voice&&!force)return;
  stopSay();
  if(!jv.length)loadVoices();
  if(cfg.vname==='online'||!('speechSynthesis' in window)||!jv.length)return sayOnline(text);
  try{
    const u=new SpeechSynthesisUtterance(text),v=bestVoice();
    u.lang='ja-JP';u.rate=.8;u.pitch=1.15;if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
loadVoices();
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{loadVoices();if(!$('cfg').hidden)renderCfg()};

/* ---------- 点击反馈 ---------- */
document.addEventListener('pointerdown',e=>{   // 水波纹
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,d=document.createElement('span');
  d.className='rip';d.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;
  b.appendChild(d);setTimeout(()=>d.remove(),600);
});
function burst(el){   // 答对时的彩色粒子
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=['#4f46e5','#8b5cf6','#d946ef','#f59e0b','#22c55e','#38bdf8'];
  for(let i=0;i<14;i++){
    const d=document.createElement('span'),a=Math.random()*Math.PI*2,dist=50+Math.random()*60;
    d.className='sp';d.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[i%6]};--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist}px`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),700);
  }
}

/* ---------- 导航 ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  $('study').hidden=b.dataset.v!=='study';$('quiz').hidden=b.dataset.v!=='quiz';
  if(b.dataset.v==='study')renderStudy();
});

/* ---------- 学习图表 ---------- */
let sm='all';
function renderStudy(){
  const lab={all:'全部显示',h:'仅平假名',k:'仅片假名'};
  $('study').innerHTML=`<div class="card"><div class="sc">${Object.keys(lab).map(k=>`<button class="chip ${sm===k?'on':''}" style="padding:8px 14px" data-m="${k}">${lab[k]}</button>`).join('')}<span style="font-size:.8rem;color:var(--m);align-self:center">点击任意假名可听发音</span></div>`+
  SEC.map(s=>`<h4>${s.name}</h4>`+s.rows.map(r=>{
    const pad=r.cells.concat(Array(Math.max(0,5-r.cells.length)).fill(null));
    return `<div class="sg">${pad.map(c=>!c?'<div></div>':`<button class="kc" data-s="${c.h}"><b>${sm==='k'?c.k:c.h}</b><span>${sm==='all'?c.k+' · '+c.r:c.r}</span></button>`).join('')}</div>`}).join('')).join('')+'</div>';
}
$('study').onclick=e=>{
  const m=e.target.closest('[data-m]');if(m){sm=m.dataset.m;return renderStudy()}
  const k=e.target.closest('[data-s]');if(k){k.classList.remove('hit');k.offsetWidth;k.classList.add('hit');setTimeout(()=>k.classList.remove('hit'),450);say(k.dataset.s,true)}
};

/* ---------- 配置页 ---------- */
function renderCfg(){
  const mb=key=>MODES.map(([k,n])=>`<button class="opt ${cfg[key]===k?'on':''}" data-k="${key}" data-v="${k}">${n}</button>`).join('');
  $('cfg').innerHTML=`<div class="hero">🎮<h1>配置你的挑战</h1></div>
  <div class="two"><div><h3>题目显示</h3>${mb('q')}</div><div><h3>选项显示</h3>${mb('o')}</div></div>
  <label class="voice"><input type="checkbox" id="vc" ${cfg.voice?'checked':''}>🔊 自动朗读假名(出现平假名/片假名时发音,可随时关闭)</label>
  <div class="vrow"><select id="vs" aria-label="选择声音"><option value="">自动(优先女声)</option>${jv.map(v=>`<option value="${v.name}" ${cfg.vname===v.name?'selected':''}>${v.name}</option>`).join('')}<option value="online" ${cfg.vname==='online'?'selected':''}>在线女声(需联网)</option></select><button class="chip" data-t="1" style="padding:8px 14px">▶ 试听</button></div>
  <hr>
  ${SEC.map(s=>`<h4>${s.name}<button class="all" data-s="${s.id}">全选</button></h4><div class="chips">${s.rows.map(r=>`<button class="chip ${cfg.rows.includes(r.id)?'on':''}" data-r="${r.id}">${r.name}</button>`).join('')}</div>`).join('')}
  <div class="go"><button class="big" data-g="normal">▶️ 常规挑战</button><button class="big mix" data-g="mix">🔀 混合挑战<small>题目/选项随机互换</small></button></div>
  <button class="heart" data-g="heart">💓 心动挑战 (限时)<small>5秒限时 | 10层衣服挑战 | 像素风少女</small></button>`;
}
$('cfg').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k){cfg[b.dataset.k]=b.dataset.v}
  else if(b.dataset.r){const i=cfg.rows.indexOf(b.dataset.r);i>-1?cfg.rows.splice(i,1):cfg.rows.push(b.dataset.r)}
  else if(b.dataset.s){const ids=SEC.find(s=>s.id===b.dataset.s).rows.map(r=>r.id);const all=ids.every(i=>cfg.rows.includes(i));
    cfg.rows=cfg.rows.filter(i=>!ids.includes(i));if(!all)cfg.rows=cfg.rows.concat(ids)}
  else if(b.dataset.t){say('あいうえお',true);return}
  else if(b.dataset.g){b.classList.add('pop');setTimeout(()=>startGame(b.dataset.g),180);return}
  save();renderCfg();
  const sel=b.dataset.k?`[data-k="${b.dataset.k}"][data-v="${b.dataset.v}"]`:b.dataset.r?`[data-r="${b.dataset.r}"]`:`[data-s="${b.dataset.s}"]`;
  const n=$('cfg').querySelector(sel);if(n)n.classList.add('pop');
};
$('cfg').onchange=e=>{if(e.target.id==='vs'){cfg.vname=e.target.value;save();say('あいうえお',true);return}
  if(e.target.id==='vc'){cfg.voice=e.target.checked;save();if(cfg.voice)say('あ')}};

/* ---------- 出题:打乱 + 防重复 ---------- */
let pool=[],bag=[],hist=[];
function nextItem(){
  if(bag.length<pool.length)bag=bag.concat(shuffle(pool.slice()));
  const multi=new Set(pool.map(c=>c.rid)).size>1;
  const rec=hist.slice(-Math.min(6,pool.length-1)),last=hist[hist.length-1];
  const adj=c=>last&&Math.abs(c.g-last.g)===1;          // 不允许 a→i→u 这种顺序相邻
  const tiers=[
    c=>!rec.includes(c)&&!adj(c)&&(!multi||!last||c.rid!==last.rid), // 最近没出现 + 不相邻 + 不同一行
    c=>!rec.includes(c)&&!adj(c),
    c=>!rec.includes(c),
    c=>c!==last||pool.length===1,
    ()=>true];
  for(const f of tiers){const i=bag.findIndex(f);if(i>-1){const c=bag.splice(i,1)[0];hist.push(c);return c}}
}
function pickModes(type){
  const M=['h','k','r'];let q=cfg.q,o=cfg.o;
  if(type==='mix')q=o='x';
  if(q==='x'&&o==='x')q=rnd(M);
  if(q==='x')q=rnd(M.filter(m=>m!==o));
  if(o==='x')o=rnd(M.filter(m=>m!==q));
  if(q===o)o=rnd(M.filter(m=>m!==q));
  return [q,o];
}
function makeOpts(item){
  let d=shuffle(pool.filter(c=>c!==item)).slice(0,3);
  if(d.length<3)d=d.concat(shuffle(ALL.filter(c=>c!==item&&!d.includes(c))).slice(0,3-d.length));
  const arr=shuffle([item,...d]);return{arr,ci:arr.indexOf(item)};
}

/* ---------- 像素少女(10 层衣物,答错脱掉最外层) ---------- */
const P=(x,y,w,h,f,s)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${s?` stroke="${s}" stroke-width=".5"`:''}/>`;
const LAYERS=[
['袜子',P(12,35,3,5,'#fff')+P(17,35,3,5,'#fff')],
['靴子',P(11,40,5,3,'#7b4a2d')+P(16,40,5,3,'#7b4a2d')],
['毛衣',P(10,16,12,10,'#a78bfa')+P(8,16,2,9,'#a78bfa')+P(22,16,2,9,'#a78bfa')],
['手套',P(8,24,2,2,'#f472b6')+P(22,24,2,2,'#f472b6')],
['眼镜',P(12,9,4,3,'none','#333')+P(17,9,4,3,'none','#333')],
['发饰',P(20,5,3,3,'#f43f5e')],
['外套',P(9,16,14,13,'#ef4444')+P(7,16,2,10,'#ef4444')+P(23,16,2,10,'#ef4444')+P(15,16,2,13,'#fca5a5')],
['围巾',P(10,15,12,2,'#fbbf24')+P(10,17,3,6,'#fbbf24')],
['背包',P(8,17,1,8,'#10b981')+P(23,17,1,8,'#10b981')],
['帽子',P(9,2,14,4,'#3b82f6')+P(8,5,16,1,'#2563eb')]
];
const girlSvg=()=>`<svg id="girl" viewBox="0 0 32 44" aria-label="像素少女">`+
  P(10,4,12,10,'#7c4a2a')+P(11,7,10,8,'#fcd9b6')+P(13,10,1,2,'#222')+P(18,10,1,2,'#222')+P(15,13,2,1,'#f472b6')+
  P(11,16,10,10,'#fff')+P(9,16,2,9,'#fcd9b6')+P(21,16,2,9,'#fcd9b6')+P(11,26,10,5,'#60a5fa')+
  P(12,31,3,9,'#fcd9b6')+P(17,31,3,9,'#fcd9b6')+P(11,40,5,2,'#cbd5e1')+P(16,40,5,2,'#cbd5e1')+
  LAYERS.map((l,i)=>`<g id="L${i+1}">${l[1]}</g>`).join('')+`</svg>`;
function updGirl(){
  LAYERS.forEach((_,i)=>$('L'+(i+1)).style.display=i+1<=G.layers?'':'none');
  $('lay').textContent=`💗 剩余衣物 ${G.layers}/10`+(G.layers?`(最外层:${LAYERS[G.layers-1][0]})`:'');
}

/* ---------- 游戏流程 ---------- */
let G={};
const show=id=>['cfg','play','res'].forEach(x=>$(x).hidden=x!==id);
function startGame(type){
  pool=ALL.filter(c=>cfg.rows.includes(c.rid));
  if(!pool.length)return toast('请至少选择一行假名');
  bag=[];hist=[];
  G={type,n:0,total:type==='heart'?30:20,score:0,streak:0,wrong:[],layers:10,locked:true};
  const heart=type==='heart';
  $('play').innerHTML=`<div class="bar"><span id="pg"></span><span id="sc"></span><span><button class="ic" id="vt" title="朗读开关"></button><button class="ic" id="qt" title="退出">✕</button></span></div>
  ${heart?`<div class="stage" id="stg">${girlSvg()}<div class="side"><div class="lay" id="lay"></div><div class="tb"><i id="tbi"></i></div></div></div>`:''}
  <div class="q" id="qc"></div><p class="hint" id="hn"></p><div class="opts" id="ops"></div><div class="fb" id="fb"></div>`;
  show('play');nextQ();
}
function nextQ(){
  if(G.n>=G.total)return finish(true);
  G.n++;G.locked=false;
  const item=nextItem();[G.qm,G.om]=pickModes(G.type);
  const {arr,ci}=makeOpts(item);Object.assign(G,{item,arr,ci});
  $('pg').textContent=`第 ${G.n}/${G.total} 题`;
  $('sc').textContent=`✅ ${G.score}  🔥 ${G.streak}`;
  $('vt').textContent=cfg.voice?'🔊':'🔇';
  const qc=$('qc');qc.textContent=item[G.qm];qc.className='q in'+(G.qm==='r'?' r':'');
  $('hn').textContent=`选出对应的${MN[G.om]}`;$('fb').textContent='';
  $('ops').innerHTML=arr.map((c,i)=>`<button class="ans" data-i="${i}"><i>${i+1}</i>${c[G.om]}</button>`).join('');
  if(G.type==='heart'){updGirl();startTimer()}
  if(G.qm!=='r')say(item.h);   // 题目是假名 → 自动朗读
}
function startTimer(){
  const b=$('tbi');b.style.transition='none';b.style.width='100%';b.offsetWidth;
  b.style.transition='width 5s linear';b.style.width='0';
  G.tm=setTimeout(()=>answer(-1),5000);
}
function answer(i){
  if(G.locked)return;G.locked=true;clearTimeout(G.tm);
  const ok=i===G.ci,btns=[...document.querySelectorAll('.ans')];
  btns[G.ci].classList.add('ok');if(!ok&&i>-1)btns[i].classList.add('no');
  if(ok)burst(btns[G.ci]);else{const q=$('qc');q.classList.remove('shake');q.offsetWidth;q.classList.add('shake')}
  try{navigator.vibrate&&navigator.vibrate(ok?15:[30,40,30])}catch(e){}
  if(G.type==='heart'){const b=$('tbi');b.style.width=getComputedStyle(b).width;b.style.transition='none'}
  if(ok){G.score++;G.streak++}else{G.streak=0;if(!G.wrong.includes(G.item))G.wrong.push(G.item)}
  $('sc').textContent=`✅ ${G.score}  🔥 ${G.streak}`;
  let msg=ok?'👍 正确':`${i<0?'⏰ 超时':'❌ 错误'}:${G.item.h} ${G.item.k} = ${G.item.r}`;
  if(G.type==='heart'&&!ok){
    msg+=` · 脱下了「${LAYERS[G.layers-1][0]}」`;G.layers--;updGirl();
    const s=$('stg');s.classList.remove('shake');s.offsetWidth;s.classList.add('shake');
  }
  $('fb').style.color=ok?'var(--ok)':'var(--no)';$('fb').textContent=msg;
  if(G.qm==='r')say(G.item.h);  // 题目是罗马音 → 答完后朗读答案
  if(G.type==='heart'&&G.layers<=0)return setTimeout(()=>finish(false),1500);
  setTimeout(nextQ,ok?650:1500);
}
function finish(done){
  clearTimeout(G.tm);stopSay();
  const answered=done?G.total:G.n,acc=answered?Math.round(G.score/answered*100):0,heart=G.type==='heart';
  const e=heart?(done?'💖':'💔'):(acc>=90?'🏆':acc>=70?'👏':'💪');
  const t=heart?(done?'通关!她还穿着大部分衣服':'10 层衣物全部掉落,挑战失败'):(acc>=90?'太棒了!':acc>=70?'不错,继续加油':'再练练,会越来越熟');
  $('res').innerHTML=`<div class="e">${e}</div><h2>${t}</h2><div class="n">${G.score} / ${answered}</div><p style="color:var(--m)">正确率 ${acc}%</p>
  ${G.wrong.length?`<h4 style="justify-content:center;margin-top:18px">需要加强的假名</h4><div class="wl">${G.wrong.map(c=>`<span>${c.h} ${c.k} ${c.r}</span>`).join('')}</div>`:'<p style="margin-top:16px">全部答对,零失误 ✨</p>'}
  <div class="rb"><button class="pri" id="again">再来一次</button><button id="back">返回设置</button></div>`;
  show('res');
  $('again').onclick=()=>startGame(G.type);$('back').onclick=()=>{renderCfg();show('cfg')};
}
$('play').onclick=e=>{
  const a=e.target.closest('.ans');if(a)return answer(+a.dataset.i);
  if(e.target.closest('#qt')){clearTimeout(G.tm);G.locked=true;stopSay();renderCfg();return show('cfg')}
  if(e.target.closest('#vt')){cfg.voice=!cfg.voice;save();$('vt').textContent=cfg.voice?'🔊':'🔇';if(cfg.voice&&G.qm!=='r'&&!G.locked)say(G.item.h);else stopSay();return}
  if(e.target.closest('#qc')&&G.qm!=='r')say(G.item.h,true);
};
document.addEventListener('keydown',e=>{
  if($('play').hidden||!'1234'.includes(e.key)||e.key==='')return;
  answer(+e.key-1);
});

renderCfg();
</script>
</body>
</html>
